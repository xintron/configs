[settings]
minimum_release_age = "2d"
experimental = true
idiomatic_version_file_enable_tools = ["java"]
auto_update = true

[tools]
# --- Version Control & Git Tools ---
jj = "latest"
jjui = "latest"
lazygit = "latest"
gitu = "latest"
delta = "latest"
hunk = "latest"

# --- Search & Find ---
fd = "latest"
rg = "latest"
fzf = "latest"
ast-grep = "latest"
"github:asciimoo/hister" = "0.18.0"

# --- Navigation & File Management ---
zoxide = "latest"
yazi = "latest"
vivid = "latest"

# --- Terminal & Shell ---
zellij = "latest"
starship = "latest"

# --- Editor ---
neovim = "latest"
tree-sitter = "latest"
helix = "latest"
"npm:markserv" = "latest"

# --- AI & Assistants ---
opencode = "latest"
difftastic = "latest"
github-cli = "latest"
"npm:@tobilu/qmd" = { version = "latest", allow_builds = ["better-sqlite3"] }

# --- Languages & Runtimes ---
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
lua-language-server = "latest"
stylua = "latest"
oxfmt = "latest"
qsv = "latest"
node = "lts"
python = "latest"
uv = "latest"

[dotfiles]
"~/.zshrc" = "~/git/configs/zsh/.zshrc"
"~/.zshenv" = "~/git/configs/zsh/.zshenv"
"~/.config/starship.toml" = "~/git/configs/starship.toml"
"~/.config/ghostty" = "~/git/configs/ghostty"
"~/.config/helix" = "~/git/configs/helix"
"~/.config/lazygit" = "~/git/configs/lazygit"
"~/.config/wezterm" = "~/git/configs/wezterm"
"~/.config/nvim" = "~/git/configs/nvim"
"~/.config/zellij/config.kdl" = "~/git/configs/zellij/config.kdl"
"~/.config/mise/config.toml" = "~/git/configs/mise/config.toml"
"~/.config/hunk/config.toml" = "~/git/configs/hunk/config.toml"
"~/.config/opencode/themes/catppuccin-latte-green.json" = "~/git/catppuccin/opencode/themes/latte/catppuccin-latte-green.json"
"~/.config/opencode/themes/catppuccin-macchiato-green.json" = "~/git/catppuccin/opencode/themes/macchiato/catppuccin-macchiato-green.json"
"~/.aerospace.toml" = "~/git/configs/.aerospace.toml"
"~/.agents/skills/go" = "~/git/spf13-go-skills/go"
"~/.agents/skills/go-spec-reviewer" = "~/git/spf13-go-skills/go-spec-reviewer"
"~/.agents/skills/brainstorming" = "~/git/superpowers/skills/brainstorming"
"~/.agents/skills/executing-plans" = "~/git/superpowers/skills/executing-plans"
"~/.agents/skills/systematic-debugging" = "~/git/superpowers/skills/systematic-debugging"
"~/.agents/skills/test-driven-development" = "~/git/superpowers/skills/test-driven-development"
"~/.agents/skills/using-git-worktrees" = "~/git/superpowers/skills/using-git-worktrees"
"~/.agents/skills/writing-plans" = "~/git/superpowers/skills/writing-plans"
"~/.agents/skills/subagent-driven-development" = "~/git/superpowers/skills/subagent-driven-development"
"~/.gemini/skills/go" = "~/git/spf13-go-skills/go"
"~/.gemini/skills/go-spec-reviewer" = "~/git/spf13-go-skills/go-spec-reviewer"
"~/.gemini/skills/brainstorming" = "~/git/superpowers/skills/brainstorming"
"~/.gemini/skills/executing-plans" = "~/git/superpowers/skills/executing-plans"
"~/.gemini/skills/systematic-debugging" = "~/git/superpowers/skills/systematic-debugging"
"~/.gemini/skills/test-driven-development" = "~/git/superpowers/skills/test-driven-development"
"~/.gemini/skills/using-git-worktrees" = "~/git/superpowers/skills/using-git-worktrees"
"~/.gemini/skills/writing-plans" = "~/git/superpowers/skills/writing-plans"
"~/.gemini/skills/subagent-driven-development" = "~/git/superpowers/skills/subagent-driven-development"

[bootstrap.repos]
"~/git/catppuccin/fzf" = { url = "https://github.com/catppuccin/fzf.git" }
"~/git/catppuccin/lazygit" = { url = "https://github.com/catppuccin/lazygit.git" }
"~/git/catppuccin/delta" = { url = "https://github.com/catppuccin/delta.git" }
"~/git/catppuccin/opencode" = { url = "https://github.com/catppuccin/opencode.git" }
"~/git/superpowers" = { url = "https://github.com/obra/superpowers.git" }
"~/git/spf13-go-skills" = { url = "https://github.com/spf13/go-skills" }
