[settings]
minimum_release_age = "2d"
experimental = true
idiomatic_version_file_enable_tools = ["java"]

[tools]
# --- Version Control & Git Tools ---
jj = "latest"
jjui = "latest"
lazygit = "latest"
gitu = "latest"
delta = "latest"
hunk = "latest"

# --- Search & Find ---
fd = "latest"
rg = "latest"
fzf = "latest"
ast-grep = "latest"

# --- Navigation & File Management ---
zoxide = "latest"
yazi = "latest"
vivid = "latest"

# --- Terminal & Shell ---
zellij = "latest"
starship = "latest"

# --- Editor ---
neovim = "latest"
tree-sitter = "latest"
helix = "latest"
"npm:markserv" = "latest"

# --- AI & Assistants ---
opencode = "latest"
difftastic = "latest"
github-cli = "latest"
"npm:@tobilu/qmd" = { version = "latest", allow_builds = ["better-sqlite3"] }

# --- Languages & Runtimes ---
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
lua-language-server = "latest"
stylua = "latest"
oxfmt = "latest"
qsv = "latest"
node = "lts"
python = "latest"
uv = "latest"

[dotfiles]
"~/.zshrc" = { source = "~/git/configs/zsh/.zshrc" }
"~/.zshenv" = { source = "~/git/configs/zsh/.zshenv" }
"~/.config/starship.toml" = { source = "~/git/configs/starship.toml" }
"~/.config/ghostty" = { source = "~/git/configs/ghostty" }
"~/.config/helix" = { source = "~/git/configs/helix" }
"~/.config/lazygit" = { source = "~/git/configs/lazygit" }
"~/.config/wezterm" = { source = "~/git/configs/wezterm" }
"~/.config/nvim" = { source = "~/git/configs/nvim" }
"~/.config/zellij/config.kdl" = { source = "~/git/configs/zellij/config.kdl" }
"~/.config/mise/config.toml" = { source = "~/git/configs/mise/config.toml" }
"~/.config/hunk/config.toml" = { source = "~/git/configs/hunk/config.toml" }
"~/.aerospace.toml" = { source = "~/git/configs/.aerospace.toml" }
"~/.agents/skills/superpowers" = { source = "~/git/superpowers/skills" }

[bootstrap.repos]
"~/git/catppuccin/fzf" = { url = "https://github.com/catppuccin/fzf.git" }
"~/git/catppuccin/lazygit" = { url = "https://github.com/catppuccin/lazygit.git" }
"~/git/superpowers" = { url = "https://github.com/obra/superpowers.git" }
