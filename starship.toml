"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](yellow)\
$directory\
[](fg:yellow bg:green)\
$git_branch\
$git_status\
[ ](fg:green)\
$cmd_duration\
$jobs\
$character"""

[directory]
style = "inverted yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[git_branch]
symbol = ""
style = "inverted green"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "inverted green"
format = '[($all_status$ahead_behind )]($style)'

[cmd_duration]
min_time = 2000
style = "yellow"
format = '[󱦟 $duration ]($style)'

[character]
success_symbol = '[\$](bold green)'
error_symbol = '[\$](bold red)'

[jobs]
symbol = "✦"
number_threshold = 1
format = "[$symbol($count)]($style) "
style = "bold red"
